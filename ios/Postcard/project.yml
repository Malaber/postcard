name: Postcard
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: VWKG94374J
targets:
  Postcard:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources: [App, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malaber.postcard
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Postcard
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: de.malaber.postcard.auth
            CFBundleURLSchemes: [de.malaber.postcard]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  PostcardUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'
    sources: [UITests]
    dependencies:
      - target: Postcard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malaber.postcard.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Postcard:
    build:
      targets:
        Postcard: all
    test:
      targets: [PostcardUITests]
