{% extends 'base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 50px auto; background: white; padding: 2rem; border-radius: 12px; border: 1px solid #ddd; text-align: center;">

    <h2 style="color: #dc2626; margin-top: 0;">Delete Photo?</h2>
    <p>Are you sure you want to permanently remove this photo from <strong>{{ photo.frame.name }}</strong>?</p>

    <div style="margin: 20px 0;">
        <img src="{{ photo.viewer_image_url }}" style="max-width: 100%; height: 200px; object-fit: contain; border-radius: 8px; border: 1px solid #eee;">
    </div>

    <p style="font-size: 0.9rem; color: #666;">This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}

        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 25px;">
            <a href="{% url 'frame_detail' photo.frame.id %}"
               style="padding: 10px 20px; background: #f3f4f6; color: #333; text-decoration: none; border-radius: 6px; font-weight: bold; line-height: 1.5;">
               Cancel
            </a>

            <button type="submit"
                    autofocus
                    style="padding: 10px 20px; background: #dc2626; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem;">
                Yes, Delete it
            </button>
        </div>
    </form>
</div>
{% endblock %}
