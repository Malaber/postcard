<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passkey Registration</title>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f4f4f9; }
        .card { background: white; border: 1px solid #ddd; padding: 2rem; border-radius: 12px; width: 320px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        input { width: 100%; padding: 10px; margin: 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        button:hover { background: #1d4ed8; }
        #status { margin-top: 15px; font-size: 0.9em; min-height: 1.2em; word-break: break-word; }
        .error { color: #dc2626; }
        .success { color: #16a34a; }
    </style>
</head>
<body>

<div class="card">
    <h2>Create Account</h2>
    <p>Register using FaceID, TouchID, or Windows Hello.</p>

    <input type="text" id="username" placeholder="Username (e.g. Grandma)" />
    <button onclick="registerUser()">Create Passkey</button>

    <div id="status"></div>
</div>

<script>
    async function registerUser() {
        const username = document.getElementById('username').value;
        const status = document.getElementById('status');

        if (!window.PublicKeyCredential) {
            status.innerHTML = "<span class='error'>Browser too old.</span>";
            return;
        }

        if (!username) {
            status.innerHTML = "<span class='error'>Please enter a username!</span>";
            return;
        }

        try {
            status.innerHTML = "Requesting challenge...";

            const optionsRes = await fetch(`/auth/register/options/?username=${encodeURIComponent(username)}`);
            const optionsJSON = await optionsRes.json();

            // Security Check
            if (optionsJSON.rp.id !== window.location.hostname) {
                throw new Error(`Config Mismatch: Server expects '${optionsJSON.rp.id}'`);
            }

            const publicKeyOptions = PublicKeyCredential.parseCreationOptionsFromJSON(optionsJSON);

            status.innerHTML = "Scan fingerprint now...";
            const credential = await navigator.credentials.create({ publicKey: publicKeyOptions });
            const credentialJSON = credential.toJSON();

            // --- MERGE USERNAME INTO PAYLOAD ---
            const payload = {
                ...credentialJSON,
                username: username
            };

            status.innerHTML = "Verifying...";

            const verifyRes = await fetch('/auth/register/verify/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload) // Sending payload with username
            });

            const result = await verifyRes.json();

            if (verifyRes.ok) {
                status.innerHTML = `<span class='success'>Success! Welcome, ${result.user}.</span>`;
            } else {
                throw new Error(result.message || "Unknown server error");
            }

        } catch (e) {
            console.error(e);
            status.innerHTML = `<span class='error'>Error: ${e.message}</span>`;
        }
    }
</script>

</body>
</html>
