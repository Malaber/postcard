{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ frame.name }} - Player</title>
    <style>
        /* --- VISUAL STYLE (From your preferred version) --- */

        /* Kiosk Reset */
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden; /* No scrollbars */
            cursor: none; /* Hide mouse cursor */
        }

        /* The Container */
        #stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Photos */
        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain; /* Ensure whole photo is visible */
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* Smooth Fade */
            z-index: 1; /* Default layer */
        }

        /* Class to show the active photo */
        .slide.active {
            opacity: 1;
            z-index: 2; /* Bring to front */
        }

        /* Loading / Message State */
        .message {
            color: #555;
            font-family: sans-serif;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="stage">
    <div class="message" id="loading-msg">
        <h1>Loading Photos...</h1>
        <p>{{ frame.name }}</p>
    </div>
</div>

<div id="debug" style="display:none;"></div>

<script>
    /* --- CONFIGURATION --- */
    const TOKEN = "{{ frame.access_token }}";
    const API_URL = `/p/frame/${TOKEN}/api/`;
    const PHOTO_CACHE_NAME = `frame-photos-${TOKEN}`;
    const SYNC_INTERVAL = 1000; // TODO Shorter interval if not DEBUG 60*1000 is 60 sec, use 300*1000
    const SLIDE_DURATION = 5000;    // TODO set to 20s or something, currently 5s for debugging

    let playlist = []; // Holds Blob URLs
    let currentIndex = 0;
    let slideTimer = null;

    /* --- 1. SERVICE WORKER (Offline Capability) --- */
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register("{% static 'sw.js' %}")
            .catch(err => console.error('SW Failed', err));
    }

    /* --- 2. SYNC ENGINE (Download & Cache) --- */
    async function syncPhotos() {
        try {
            // A. Get list from server
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error("Offline");

            const data = await response.json();
            const serverUrls = data.photos;

            // B. Open Cache
            const cache = await caches.open(PHOTO_CACHE_NAME);
            const cachedKeys = await cache.keys();
            const cachedUrls = cachedKeys.map(req => new URL(req.url).pathname);

            // C. Download New
            const toDownload = serverUrls.filter(url => !cachedUrls.includes(url));
            await Promise.all(toDownload.map(url => cache.add(url)));

            // D. Delete Old
            const toDelete = cachedKeys.filter(req => !serverUrls.includes(new URL(req.url).pathname));
            await Promise.all(toDelete.map(req => cache.delete(req)));

            // E. Refresh Playlist
            await refreshPlaylistFromCache();

        } catch (e) {
            console.log("Sync failed (Offline mode active).");
            await refreshPlaylistFromCache();
        }
    }

    /* --- 3. PLAYLIST MANAGER --- */
    async function refreshPlaylistFromCache() {
        const cache = await caches.open(PHOTO_CACHE_NAME);
        const keys = await cache.keys();

        // Convert cache files to Blob URLs
        const newPlaylist = [];
        for (const request of keys) {
            const response = await cache.match(request);
            if (response) {
                const blob = await response.blob();
                newPlaylist.push(URL.createObjectURL(blob));
            }
        }

        if (newPlaylist.length > 0) {
            playlist = newPlaylist;

            // Remove loading text
            const msg = document.getElementById('loading-msg');
            if (msg) msg.remove();

            // Start if not running
            if (!slideTimer) startSlideshow();
        }
    }

    /* --- 4. VISUAL PLAYER (The Pretty Part) --- */
    function startSlideshow() {
        // Show the first one immediately
        showNextSlide();
        // Schedule the loop
        slideTimer = setInterval(showNextSlide, SLIDE_DURATION);
    }

    function showNextSlide() {
        if (playlist.length === 0) return;

        const stage = document.getElementById('stage');
        const url = playlist[currentIndex];

        // Create the new image
        const img = document.createElement('img');
        img.src = url;
        img.className = 'slide'; // Starts with opacity: 0
        stage.appendChild(img);

        // Force browser reflow so transition works
        void img.offsetWidth;

        // Fade In
        img.classList.add('active');

        // Cleanup Logic:
        // Find all other slides that are currently visible
        const oldSlides = document.querySelectorAll('.slide:not(:last-child)');

        // Wait for the fade-in (1.5s) to mostly finish before removing the old one
        // This ensures no black gap between photos
        setTimeout(() => {
            oldSlides.forEach(el => {
                // If we want a perfect cross-fade, we can remove the 'active' class
                // from the old one now, triggering it to fade out while new one fades in.
                el.classList.remove('active');

                // Remove from DOM after transition finishes (1.5s + buffer)
                setTimeout(() => el.remove(), 2000);
            });
        }, 1500); // Wait for new photo to be fully visible?
        // Actually, for a smoother cross-fade, we usually overlap them.
        // With CSS Absolute positioning, they are already on top of each other.
        // The new one (z-index 2) fading in ON TOP of the old one is usually smoothest.

        // Advance Index
        currentIndex = (currentIndex + 1) % playlist.length;
    }

    // --- BOOT ---
    syncPhotos();
    setInterval(syncPhotos, SYNC_INTERVAL);
</script>

</body>
</html>
