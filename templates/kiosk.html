<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><title>{{ frame.name }} — Postcard</title>
<style>html,body{margin:0;height:100%;background:#080b12;color:white;font-family:system-ui}main{height:100%;display:grid;place-items:center}img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}#status{text-align:center}</style></head>
<body><main><div id="status">Waiting for your first photo…</div><img id="photo" alt="Photo on {{ frame.name }}" hidden></main>
<script>
const endpoint = "{% url 'frame_photos_json' frame.access_token %}";
const image = document.querySelector('#photo'), status = document.querySelector('#status');
let photos = [], index = 0, current = '';
function show() {
  if (!photos.length) { image.hidden = true; image.removeAttribute('src'); current = ''; return; }
  index %= photos.length; current = photos[index]; image.src = current; image.hidden = false; status.hidden = true;
}
async function sync() {
  try {
    const response = await fetch(endpoint, {cache: 'no-store'});
    if (response.status === 404) {
      photos = []; show(); status.hidden = false; status.textContent = 'Viewer disconnected. Open a new private link.'; return;
    }
    if (!response.ok) return;
    const data = await response.json(); photos = data.photos;
    if (!photos.includes(current)) { index = 0; show(); }
    if (!photos.length) { status.hidden = false; status.textContent = 'Waiting for your first photo…'; }
  } catch { /* Keep the currently displayed photo during a temporary outage. */ }
}
sync(); setInterval(sync, 5000);
setInterval(() => { index++; show(); }, 15000);
</script></body></html>
