{% extends 'base.html' %}
{% load static %}
{% block content %}
<section style="max-width:420px;margin:auto">
<h1>Send a little joy.</h1>
<p>Your photos, on their favourite screen. Sign in or create a Postcard account with a passkey.</p>
<form id="auth-form" data-next="{{ next_url }}">
{% csrf_token %}
<label for="username">Username <small>(optional when signing in)</small></label>
<input id="username" name="username" autocomplete="username webauthn" maxlength="150" style="display:block;padding:12px;margin:16px 0;width:90%">
<button type="submit">Sign in with passkey</button>
<button type="button" id="register">{% if user.is_authenticated %}Add passkey{% else %}Create account{% endif %}</button>
<p id="status" role="status" aria-live="polite"></p>
</form>
</section>
<script type="module" src="{% static 'auth.js' %}"></script>
{% endblock %}
